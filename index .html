<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="王淇 · 智能装备制造技术 · 个人简历">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1a1a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='serif' fill='%23c8a45c' text-anchor='middle'%3E王%3C/text%3E%3C/svg%3E">
    <title>王淇 - 个人简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f6;
            --bg-card: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-muted: #9a9a9a;
            --border: #e8e5df;
            --gold: #c8a45c;
            --gold-light: #e0c98a;
            --gold-dark: #a07d3a;
            --gold-glow: rgba(200, 164, 92, 0.2);
            --accent: #b8860b;
            --accent-subtle: rgba(184, 134, 11, 0.06);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 280ms cubic-bezier(0.25, 0.1, 0.25, 1);
            --font-stack: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", -apple-system,
                BlinkMacSystemFont, sans-serif;
            --font-serif: "Noto Serif SC", "Songti SC", "STSong", var(--font-stack);
            --font-display: "Cormorant Garamond", var(--font-serif);
            --max-width: 1060px;
            --nav-height: 72px;
            --hero-gradient: linear-gradient(160deg, #1c1c1c 0%, #2a2a2a 30%, #1a1a1a 60%, #0d0d0d 100%);
            --card-gradient: linear-gradient(145deg, #ffffff 0%, #fdfaf3 100%);
            --gold-gradient: linear-gradient(135deg, #c8a45c 0%, #dfc07a 30%, #b8943f 60%, #c8a45c 100%);
            --gold-text-gradient: linear-gradient(135deg, #c8a45c 0%, #dfc07a 40%, #a07d3a 100%);
        }

        [data-theme="dark"] {
            --bg: #0d0d0d;
            --bg-card: #181818;
            --text: #e8e4dc;
            --text-secondary: #a8a49c;
            --text-muted: #6e6a62;
            --border: #2a2722;
            --gold: #d4b46c;
            --gold-light: #e8d094;
            --gold-dark: #b8943f;
            --gold-glow: rgba(212, 180, 108, 0.25);
            --accent: #d4b46c;
            --accent-subtle: rgba(212, 180, 108, 0.08);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
            --card-gradient: linear-gradient(145deg, #1a1a1a 0%, #1e1c18 100%);
            --hero-gradient: linear-gradient(160deg, #0a0a0a 0%, #111111 30%, #0a0a0a 60%, #050505 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--nav-height);
        }
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
        body {
            font-family: var(--font-stack);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 20%, var(--gold-glow) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 60%, rgba(200, 164, 92, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(200, 164, 92, 0.04) 0%, transparent 50%);
            opacity: 0.7;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 1000;
            transition: all var(--transition);
            animation: openLayerDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes openLayerDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes openLayerUp {
            from { opacity: 0; transform: translateY(26px); filter: blur(6px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        [data-theme="dark"] .navbar {
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 0.04em;
            background: var(--gold-text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: all var(--transition);
            font-feature-settings: "kern";
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 24px;
            transition: all var(--transition);
            letter-spacing: 0.02em;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 20px;
            height: 2px;
            background: var(--gold-gradient);
            border-radius: 1px;
            transition: transform var(--transition);
        }
        .nav-links a:hover,
        .nav-links a:focus-visible {
            color: var(--gold-dark);
            background: var(--accent-subtle);
            outline: none;
        }
        .nav-links a:hover::after,
        .nav-links a:focus-visible::after {
            transform: translateX(-50%) scaleX(1);
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            cursor: pointer;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            color: var(--text-secondary);
            position: relative;
            overflow: hidden;
        }
        .icon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--gold-gradient);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .icon-btn:hover::before {
            opacity: 0.12;
        }
        .icon-btn:hover {
            border-color: var(--gold);
            color: var(--gold-dark);
            box-shadow: 0 4px 16px var(--gold-glow);
        }
        .icon-btn:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }
        @media (max-width: 768px) {
            .navbar {
                padding: 0 14px;
            }
            .nav-links a {
                font-size: 0.75rem;
                padding: 8px 11px;
            }
            .nav-brand {
                font-size: 1.1rem;
            }
        }
        @media (max-width: 520px) {
            .nav-links a {
                font-size: 0.68rem;
                padding: 6px 8px;
            }
        }

        /* ===== 顶部滚动进度条 ===== */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2.5px;
            width: 0%;
            background: var(--gold-gradient);
            box-shadow: 0 0 10px var(--gold-glow);
            z-index: 1100;
            transition: width 80ms linear;
        }

        /* ===== 导航当前项高亮 ===== */
        .nav-links a.current {
            color: var(--gold-dark);
            background: var(--accent-subtle);
        }
        .nav-links a.current::after {
            transform: translateX(-50%) scaleX(1);
        }

        /* ===== 移动端汉堡菜单 ===== */
        .nav-toggle {
            display: none;
        }
        @media (max-width: 640px) {
            .nav-links {
                position: fixed;
                top: var(--nav-height);
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                background: var(--bg-card);
                border-bottom: 1px solid var(--border);
                box-shadow: var(--shadow);
                max-height: 0;
                overflow: hidden;
                transition: max-height var(--transition);
            }
            .nav-links.open {
                max-height: 420px;
            }
            .nav-links a {
                border-radius: 0;
                padding: 14px 24px;
                font-size: 0.85rem;
                border-bottom: 1px solid var(--border);
            }
            .nav-links a::after {
                display: none;
            }
            .nav-toggle {
                display: flex;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: 1px solid var(--border);
                background: var(--bg-card);
                align-items: center;
                justify-content: center;
                cursor: pointer;
                color: var(--text-secondary);
                font-size: 1.1rem;
                order: 3;
            }
        }

        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: calc(var(--nav-height) + 40px) 28px 80px;
        }

        /* ===== 进入动画 ===== */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(56px) scale(0.975);
            filter: blur(6px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform, filter;
        }
        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }
        .animate-on-scroll.from-left {
            transform: translateX(-48px) scale(0.975);
            filter: blur(6px);
        }
        .animate-on-scroll.from-left.visible {
            transform: translateX(0) scale(1);
            filter: blur(0);
        }
        .animate-on-scroll.from-right {
            transform: translateX(48px) scale(0.975);
            filter: blur(6px);
        }
        .animate-on-scroll.from-right.visible {
            transform: translateX(0) scale(1);
            filter: blur(0);
        }
        .animate-on-scroll.from-scale {
            transform: scale(0.9);
            filter: blur(6px);
        }
        .animate-on-scroll.from-scale.visible {
            transform: scale(1);
            filter: blur(0);
        }
        /* 同一板块内，标题先浮现，内容容器随后一拍出现，形成"一层一层"的节奏 */
        .section-title.animate-on-scroll ~ .tabs-container.animate-on-scroll,
        .section-title.animate-on-scroll ~ .edu-card.animate-on-scroll {
            transition-delay: 0.16s;
        }
        .stagger-children > * {
            opacity: 0;
            transform: translateY(38px) scale(0.97);
            filter: blur(5px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .stagger-children.visible > *:nth-child(1) { transition-delay: 0.06s; }
        .stagger-children.visible > *:nth-child(2) { transition-delay: 0.14s; }
        .stagger-children.visible > *:nth-child(3) { transition-delay: 0.22s; }
        .stagger-children.visible > *:nth-child(4) { transition-delay: 0.30s; }
        .stagger-children.visible > *:nth-child(5) { transition-delay: 0.38s; }
        .stagger-children.visible > *:nth-child(6) { transition-delay: 0.46s; }
        .stagger-children.visible > *:nth-child(7) { transition-delay: 0.54s; }
        .stagger-children.visible > *:nth-child(8) { transition-delay: 0.62s; }
        .stagger-children.visible > *:nth-child(9) { transition-delay: 0.70s; }
        .stagger-children.visible > *:nth-child(10) { transition-delay: 0.78s; }
        .stagger-children.visible > * {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .hero {
            background: var(--hero-gradient);
            border-radius: 20px;
            padding: 56px 48px;
            color: #f0e6d3;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(200, 164, 92, 0.2);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -80px;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 164, 92, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -60px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 164, 92, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            gap: 32px;
        }
        .hero-avatar {
            flex-shrink: 0;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 2.4rem;
            font-weight: 700;
            color: #1a1a1a;
            background: var(--gold-gradient);
            box-shadow: 0 8px 28px rgba(200, 164, 92, 0.4), inset 0 0 0 3px rgba(255, 255, 255, 0.15);
            position: relative;
        }
        .hero-avatar::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(200, 164, 92, 0.35);
        }
        .hero-text {
            min-width: 0;
        }
        /* ===== 开场层叠动画：头像→标签→姓名→职位→简介→标签行→按钮行，逐层浮现 ===== */
        .hero-avatar {
            animation: openLayerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.15s;
        }
        .hero .subtitle-tag {
            animation: openLayerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.28s;
        }
        .hero h1 {
            animation: openLayerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.38s;
        }
        .hero .hero-role {
            animation: openLayerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.48s;
        }
        .hero .summary {
            animation: openLayerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.58s;
        }
        .hero .badge-row {
            animation: openLayerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.68s;
        }
        .hero .contact-row {
            animation: openLayerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.78s;
        }
        @media (prefers-reduced-motion: reduce) {
            .navbar,
            .hero-avatar,
            .hero .subtitle-tag,
            .hero h1,
            .hero .hero-role,
            .hero .summary,
            .hero .badge-row,
            .hero .contact-row {
                animation: none;
            }
        }
        @media (max-width: 600px) {
            .hero-content {
                gap: 18px;
            }
            .hero-avatar {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }
        }
        .hero h1 {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            margin-bottom: 6px;
            background: var(--gold-text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }
        .hero .subtitle-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(200, 164, 92, 0.4);
            font-size: 0.8rem;
            font-weight: 500;
            color: #dfc07a;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
            backdrop-filter: blur(4px);
        }
        .hero .hero-role {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 1.15rem;
            font-weight: 500;
            color: #dfc07a;
            letter-spacing: 0.02em;
            margin-bottom: 10px;
        }
        .hero .summary {
            font-size: 1.05rem;
            opacity: 0.8;
            margin-bottom: 24px;
            max-width: 620px;
            line-height: 1.8;
            color: #d4c9b5;
        }
        .hero .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }
        .badge {
            display: inline-block;
            padding: 7px 18px;
            border-radius: 22px;
            font-size: 0.82rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e8dcc8;
            letter-spacing: 0.03em;
            backdrop-filter: blur(4px);
            transition: all var(--transition);
        }
        .badge.accent-badge {
            background: rgba(200, 164, 92, 0.2);
            border-color: rgba(200, 164, 92, 0.4);
            color: #f0d78c;
            font-weight: 600;
        }
        .hero .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: 28px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            font-family: var(--font-stack);
            letter-spacing: 0.02em;
        }
        .btn-gold {
            background: var(--gold-gradient);
            color: #1a1a1a;
            font-weight: 700;
            box-shadow: 0 6px 24px rgba(200, 164, 92, 0.35);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(200, 164, 92, 0.5);
            filter: brightness(1.05);
        }
        .btn-outline-gold {
            background: transparent;
            border: 1.5px solid rgba(200, 164, 92, 0.5);
            color: #dfc07a;
            backdrop-filter: blur(4px);
        }
        .btn-outline-gold:hover {
            background: rgba(200, 164, 92, 0.1);
            border-color: rgba(200, 164, 92, 0.8);
            color: #f0d78c;
            box-shadow: 0 6px 20px rgba(200, 164, 92, 0.2);
        }
        @media (max-width: 600px) {
            .hero {
                padding: 36px 22px;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .hero .summary {
                font-size: 0.9rem;
            }
        }

        .section {
            margin-bottom: 48px;
        }
        .section-title {
            font-family: var(--font-serif);
            font-size: 1.55rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.01em;
        }
        .section-title .accent-line {
            width: 4px;
            height: 30px;
            background: var(--gold-gradient);
            border-radius: 2px;
            box-shadow: 0 2px 8px var(--gold-glow);
            flex-shrink: 0;
        }
        .section-title .kicker {
            font-family: var(--font-stack);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: var(--gold-dark);
            opacity: 0.75;
            text-transform: uppercase;
            margin-left: 2px;
        }
        .section-title .title-line {
            flex: 1 1 auto;
            height: 1px;
            background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
            min-width: 24px;
        }
        .section-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold-glow);
            flex-shrink: 0;
        }

        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .highlight-card {
            background: var(--card-gradient);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 22px;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .highlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gold-gradient);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .highlight-card:hover {

                        name: '阿里巴巴人工智能训练证书 (2026.08.09)',
                        photos: [
                            { src: '屏幕截图 2026-08-09 123513.png', label: '证书截图' },
                            { src: '屏幕截图 2026-08-10 113348.png', label: '学习记录' },
                        ]
                    },
                    { 
                        name: '优秀学生会成员 (2023年、2024年)',
                        photos: []
                    },
                    { 
                        name: '跆拳道黄绿带 (2016年)',
                        photos: []
                    },
                    { 
                        name: '阿里云Apsara Clouder专项技能认证 · 大模型Clouder认证：基于通义灵码实现高效AI编码实践',
                        photos: [
                            { src: '阿里云Apsara Clouder专项技能认证.png', label: '证书原件' },
                        ]
                    },
                ],
                footerText: '© 2026 王淇 · 更新于 2026年8月',
            };

            const mainContent = document.getElementById('mainContent');
            const footer = document.getElementById('footer');
            const backToTop = document.getElementById('backToTop');
            const themeToggle = document.getElementById('themeToggle');
            const printBtn = document.getElementById('printBtn');
            const navToggle = document.getElementById('navToggle');
            const navLinks = document.getElementById('navLinks');
            const scrollProgress = document.getElementById('scrollProgress');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const lightboxClose = document.getElementById('lightboxClose');
            const html = document.documentElement;

            let currentTheme = localStorage.getItem('theme') || 'dark';
            html.setAttribute('data-theme', currentTheme);
            themeToggle.addEventListener('click', () => {
                currentTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', currentTheme);
                localStorage.setItem('theme', currentTheme);
            });

            printBtn.addEventListener('click', () => window.print());

            const toggleBackToTop = () => {
                backToTop.classList.toggle('visible', window.scrollY > 500);
            };
            window.addEventListener('scroll', toggleBackToTop, { passive: true });
            backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            window.copyEmail = () => {
                const email = ['2256355846', '@', 'qq.com'].join('');
                navigator.clipboard.writeText(email).then(() => {
                    alert('邮箱已复制到剪贴板：' + email);
                }).catch(() => {
                    prompt('请手动复制邮箱：', email);
                });
            };

            const escapeHTML = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            };

            // ===== 渲染函数 =====
            const renderHero = () => `
                <section class="hero animate-on-scroll" id="hero">
                    <div class="hero-content">
                        <div class="hero-avatar" aria-hidden="true">${escapeHTML(resume.name.slice(0,1))}</div>
                        <div class="hero-text">
                            <span class="subtitle-tag">RESUME</span>
                            <h1>${escapeHTML(resume.name)}</h1>
                            <p class="hero-role">${escapeHTML(resume.heroTitle)}</p>
                            <p class="summary">${escapeHTML(resume.heroSummary)}</p>
                            <div class="badge-row">
                                ${resume.skillBadges.map((b,i) => `<span class="badge${i<2?' accent-badge':''}">${escapeHTML(b)}</span>`).join('')}
                            </div>
                            <div class="contact-row">
                                <button class="btn btn-gold" onclick="copyEmail()" aria-label="复制邮箱">✉ 复制邮箱</button>
                                <a class="btn btn-outline-gold" href="tel:${escapeHTML(resume.phone)}">☏ ${escapeHTML(resume.phone)}</a>
                                <span class="btn btn-outline-gold" style="cursor:default;">💬 微信：${escapeHTML(resume.wechat)}</span>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            const renderHighlights = () => `
                <section class="section" id="highlights">
                    <h2 class="section-title animate-on-scroll"><span class="accent-line"></span>亮点成果<span class="kicker">HIGHLIGHTS</span><span class="title-line"></span><span class="dot"></span></h2>
                    <div class="highlights-grid stagger-children">
                        ${resume.highlights.map(h => `
                            <div class="highlight-card">
                                <div class="icon">${h.icon}</div>
                                <div class="value">${escapeHTML(h.value)}</div>
                                <div class="label">${escapeHTML(h.label)}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;

            const renderTabs = (sections, sectionId, renderItemFn, gridClass = '') => {
                const tabs = sections.map(s => s.tab);
                const uniqueTabs = [...new Set(tabs)];
                const tabId = (name) => 'tab-' + sectionId + '-' + name.replace(/\s+/g, '-');
                const panelId = (name) => 'panel-' + sectionId + '-' + name.replace(/\s+/g, '-');
                return `
                    <section class="section" id="${sectionId}">
                        <h2 class="section-title animate-on-scroll"><span class="accent-line"></span>${sectionId === 'experience' ? '经历' : '项目经历'}<span class="kicker">${sectionId === 'experience' ? 'EXPERIENCE' : 'PROJECTS'}</span><span class="title-line"></span><span class="dot"></span></h2>
                        <div class="tabs-container animate-on-scroll" role="tablist" aria-label="${sectionId === 'experience' ? '经历标签' : '项目标签'}">
                            <div class="tabs-header">
                                ${uniqueTabs.map((t, i) => `
                                    <button class="tab-btn${i===0?' active':''}" 
                                            role="tab" id="${tabId(t)}" aria-selected="${i===0?'true':'false'}" 
                                            aria-controls="${panelId(t)}" tabindex="${i===0?'0':'-1'}"
                                            data-tab="${escapeHTML(t)}" data-section="${sectionId}">
                                        ${escapeHTML(t)}
                                    </button>
                                `).join('')}
                            </div>
                            ${uniqueTabs.map((t, i) => `
                                <div class="tab-panel${i===0?' active':''}" role="tabpanel" id="${panelId(t)}" aria-labelledby="${tabId(t)}" tabindex="0">
                                    <div class="${gridClass ? gridClass + ' ' : ''}stagger-children">
                                        ${(sections.filter(s => s.tab === t)[0]?.items || []).map(item => renderItemFn(item)).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            };

            const renderExpItem = (item) => `
                <div class="exp-item">
                    <div class="exp-header">
                        <span class="role">${escapeHTML(item.role)}</span>
                        <span class="org">${escapeHTML(item.org)}</span>
                        <span class="date">${escapeHTML(item.date)}</span>
                    </div>
                    <ul class="exp-details">
                        ${item.details.map(d => `<li>${escapeHTML(d)}</li>`).join('')}
                    </ul>
                </div>
            `;

            const renderProjectItem = (item) => `
                <div class="project-card">
                    <h4>${escapeHTML(item.name)}</h4>
                    <div class="tech-stack">
                        ${item.tech.map(t => `<span class="tech-tag">${escapeHTML(t)}</span>`).join('')}
                    </div>
                    <p class="result">✦ ${escapeHTML(item.result)}</p>
                </div>
            `;

            const renderSkills = () => `
                <section class="section" id="skills">
                    <h2 class="section-title animate-on-scroll"><span class="accent-line"></span>技能矩阵<span class="kicker">SKILLS</span><span class="title-line"></span><span class="dot"></span></h2>
                    <div class="skills-grid stagger-children">
                        ${Object.entries(resume.skills).map(([cat, bars]) => `
                            <div class="skill-category">
                                <h4>${escapeHTML(cat)}</h4>
                                ${bars.map(b => `
                                    <div class="skill-bar">
                                        <div class="name"><span>${escapeHTML(b.name)}</span><span>${b.level}%</span></div>
                                        <div class="bar-bg"><div class="bar-fill" style="width:${b.level}%"></div></div>
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;

            const renderEducation = () => `
                <section class="section" id="education">
                    <h2 class="section-title animate-on-scroll"><span class="accent-line"></span>教育背景<span class="kicker">EDUCATION</span><span class="title-line"></span><span class="dot"></span></h2>
                    <div class="edu-card animate-on-scroll">
                        <div>
                            <div class="school">${escapeHTML(resume.education.school)}</div>
                            <div class="degree">${escapeHTML(resume.education.degree)}</div>
                            <p style="color:var(--text-secondary);font-size:0.85rem;margin-top:6px;">${escapeHTML(resume.education.notes)}</p>
                        </div>
                        <div style="color:var(--text-muted);font-size:0.85rem;font-weight:500;">${escapeHTML(resume.education.date)}</div>
                    </div>
                </section>
            `;

            // ===== 证书与照片区域 =====
            const renderCertificates = () => {
                // 生成证书列表，每个证书项内嵌图片
                const certItems = resume.certificates.map(cert => {
                    const hasPhotos = cert.photos && cert.photos.length > 0;
                    return `
                        <li${hasPhotos ? ' class="has-photos"' : ''}>
                            <span>🏆 ${escapeHTML(cert.name)}</span>
                            ${hasPhotos ? `
                                <div class="cert-photos-inline">
                                    ${cert.photos.map(p => `
                                        <div class="photo-wrapper">
                                            <img src="${escapeHTML(p.src)}" alt="${escapeHTML(p.label)}" loading="lazy"
                                                 data-lightbox-src="${escapeHTML(p.src)}" data-lightbox-caption="${escapeHTML(cert.name)} · ${escapeHTML(p.label)}"
                                                 onerror="this.onerror=null;const ph=document.createElement('div');ph.className='img-broken';ph.textContent='🖼';ph.title='图片暂缺：${escapeHTML(p.src).replace(/'/g,"&#39;")}';this.replaceWith(ph);">
                                            <span class="photo-label">${escapeHTML(p.label)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </li>
                    `;
                });

                return `
                    <section class="section" id="certificates">
                        <h2 class="section-title animate-on-scroll"><span class="accent-line"></span>获奖与证书<span class="kicker">AWARDS & CERTIFICATES</span><span class="title-line"></span><span class="dot"></span></h2>
                        <ul class="cert-list stagger-children">
                            ${certItems.join('')}
                        </ul>
                    </section>
                `;
            };

            const renderFooter = () => `<p>${escapeHTML(resume.footerText)}</p>`;

            // ===== 构建页面 =====
            const buildPage = () => {
                mainContent.innerHTML = [
                    renderHero(),
                    renderHighlights(),
                    renderTabs(resume.experiences, 'experience', renderExpItem),
                    renderTabs(resume.projects, 'projects', renderProjectItem, 'project-grid'),
                    renderSkills(),
                    renderEducation(),
                    renderCertificates(),
                ].join('');
                footer.innerHTML = renderFooter();
                bindTabEvents();
                initScrollAnimation();
            };

            // ===== Tab事件 =====
            const bindTabEvents = () => {
                document.querySelectorAll('.tabs-container').forEach(container => {
                    const tabButtons = container.querySelectorAll('.tab-btn');
                    tabButtons.forEach(btn => {
                        btn.addEventListener('click', () => {
                            activateTab(container, btn.getAttribute('data-tab'));
                        });
                        btn.addEventListener('keydown', (e) => {
                            const idx = Array.from(tabButtons).indexOf(btn);
                            let newIdx = idx;
                            if (e.key === 'ArrowRight') newIdx = (idx + 1) % tabButtons.length;
                            else if (e.key === 'ArrowLeft') newIdx = (idx - 1 + tabButtons.length) % tabButtons
                                .length;
                            else return;
                            e.preventDefault();
                            tabButtons[newIdx].focus();
                            tabButtons[newIdx].click();
                        });
                    });
                });
            };

            const activateTab = (container, tabName) => {
                container.querySelectorAll('.tab-btn').forEach(b => {
                    const isActive = b.getAttribute('data-tab') === tabName;
                    b.classList.toggle('active', isActive);
                    b.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    b.setAttribute('tabindex', isActive ? '0' : '-1');
                });
                container.querySelectorAll('.tab-panel').forEach(p => {
                    p.classList.toggle('active', p.id.includes(tabName.replace(/\s+/g, '-')));
                });
            };

            // ===== 滚动进入动画（Intersection Observer，每次进入视口都会重新播放） =====
            const initScrollAnimation = () => {
                const elements = document.querySelectorAll('.animate-on-scroll, .stagger-children');
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        entry.target.classList.toggle('visible', entry.isIntersecting);
                    });
                }, {
                    threshold: 0.12,
                    rootMargin: '0px 0px -30px 0px',
                });

                elements.forEach(el => observer.observe(el));
            };

            // ===== 导航链接点击 =====
            document.addEventListener('click', (e) => {
                const link = e.target.closest('.nav-links a');
                if (link) {
                    e.preventDefault();
                    const target = document.getElementById(link.getAttribute('href')?.slice(1));
                    if (target) target.scrollIntoView({ behavior: 'smooth' });
                    navLinks.classList.remove('open');
                    navToggle.setAttribute('aria-expanded', 'false');
                }
            });

            // ===== 移动端汉堡菜单 =====
            navToggle.addEventListener('click', () => {
                const isOpen = navLinks.classList.toggle('open');
                navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            // ===== 顶部滚动进度条 =====
            const updateScrollProgress = () => {
                const scrollTop = window.scrollY;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
                scrollProgress.style.width = pct + '%';
            };
            window.addEventListener('scroll', updateScrollProgress, { passive: true });

            // ===== 滚动时高亮当前导航项 =====
            const initScrollSpy = () => {
                const sections = ['hero', 'highlights', 'experience', 'projects', 'skills', 'education', 'certificates']
                    .map(id => document.getElementById(id))
                    .filter(Boolean);
                const spy = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const id = entry.target.id;
                            document.querySelectorAll('.nav-links a').forEach(a => {
                                a.classList.toggle('current', a.getAttribute('href') === '#' + id);
                            });
                        }
                    });
                }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
                sections.forEach(s => spy.observe(s));
            };

            // ===== 证书图片灯箱 =====
            const openLightbox = (src, caption) => {
                lightboxImg.src = src;
                lightboxImg.alt = caption;
                lightboxCaption.textContent = caption;
                lightbox.classList.add('open');
            };
            const closeLightbox = () => {
                lightbox.classList.remove('open');
            };
            document.addEventListener('click', (e) => {
                const img = e.target.closest('[data-lightbox-src]');
                if (img) openLightbox(img.getAttribute('data-lightbox-src'), img.getAttribute('data-lightbox-caption') || '');
            });
            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeLightbox();
            });

            buildPage();
            toggleBackToTop();
            updateScrollProgress();
            initScrollSpy();
        })();
    </script>
</body>
</html>
